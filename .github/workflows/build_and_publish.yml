name: React95 - Publish workflow

on:
  push:
    branches:
      - master
      - alpha

permissions: read-all

jobs:
  build_and_publish:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    if: startsWith(github.event.head_commit.message, 'Merge')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure CI Git User
        run: |
          git remote set-url origin https://${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git config --global user.email ggdaltoso@gmail.com
          git config --global user.name ggdaltoso
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # setup-node's `registry-url` writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # into the runner .npmrc, and that one line breaks both things this job needs.
      #
      # Installing: v6 hid the missing secret behind a dummy NODE_AUTH_TOKEN export. v7
      # removed that, so yarn now hits an unresolved placeholder and fails with
      # "Failed to replace env in config". That is what reverted the last v7 bump.
      #
      # Publishing: npm treats any auth line as "already authenticated" and never starts
      # the OIDC exchange, so trusted publishing dies with ENEEDAUTH.
      #
      # Dropping the line before anything runs settles both. The registry stays.
      - name: Clear placeholder npm auth line
        run: sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"

      - name: Install dependencies
        run: yarn --pure-lockfile --non-interactive

      - name: Lint
        run: yarn lint:all

      - name: Test
        run: yarn test

      - name: Build
        run: |
          yarn build

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships 11.19.0 today, but nx commits
      # and tags before it publishes, so an unexpected downgrade should stop the job here
      # rather than halfway through a release.
      - name: Check npm supports trusted publishing
        run: |
          npx --yes semver -r '>=11.5.1' "$(npm --version)" >/dev/null || {
            echo "npm $(npm --version) is too old for trusted publishing (need >= 11.5.1)" >&2
            exit 1
          }

      - name: Publish
        run: |
          yarn config set registry https://registry.npmjs.org/
          chmod +x ./scripts/publish
          ./scripts/publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Build storybook
        if: github.ref == 'refs/heads/master'
        run: |
          yarn build:storybook

      - name: Deploy storybook
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: ./packages/core/docs

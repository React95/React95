name: React95 - Publish workflow

on:
  push:
    branches:
      - master
      - alpha

permissions: read-all

jobs:
  build_and_publish:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    if: startsWith(github.event.head_commit.message, 'Merge')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure CI Git User
        run: |
          git remote set-url origin https://${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git config --global user.email ggdaltoso@gmail.com
          git config --global user.name ggdaltoso
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: yarn --pure-lockfile --non-interactive

      - name: Lint
        run: yarn lint:all

      - name: Test
        run: yarn test

      - name: Build
        run: |
          yarn build

      # npm authenticates to the registry over OIDC (trusted publishing), so there is no
      # NPM_TOKEN to rotate. Two things have to hold for the exchange to happen:
      #
      # 1. npm must be >= 11.5.1. Node 24 currently ships 11.19.0, but the job publishes
      #    from master after commit and tag, so an unexpected downgrade should stop us
      #    here rather than halfway through the release.
      # 2. The runner .npmrc must not contain an auth line. setup-node's `registry-url`
      #    writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into it, and npm
      #    reads that as "already authenticated" and never starts the OIDC exchange, which
      #    surfaces as ENEEDAUTH. Drop the line and keep the registry.
      - name: Prepare npm for trusted publishing
        run: |
          npx --yes semver -r '>=11.5.1' "$(npm --version)" >/dev/null || {
            echo "npm $(npm --version) is too old for trusted publishing (need >= 11.5.1)" >&2
            exit 1
          }
          sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"

      - name: Publish
        run: |
          yarn config set registry https://registry.npmjs.org/
          chmod +x ./scripts/publish
          ./scripts/publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Build storybook
        if: github.ref == 'refs/heads/master'
        run: |
          yarn build:storybook

      - name: Deploy storybook
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: ./packages/core/docs

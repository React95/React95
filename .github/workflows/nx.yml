name: Nx CI
on: [pull_request]

permissions: read-all

jobs:
  pr:
    name: Nx Cloud Checker
    uses: nrwl/ci/.github/workflows/nx-cloud-main.yml@v0.15.0
    with:
      node-version: 24
      yarn-version: 1.22.19
      number-of-agents: 3
      main-branch-name: master
      init-commands: |
        yarn nx-cloud start-ci-run --stop-agents-after="lint,test,build,test-storybook,build-storybook"
      parallel-commands: |
        yarn nx-cloud record -- yarn nx format:check
      parallel-commands-on-agents: |
        yarn nx affected -t lint,test,build,test-storybook,build-storybook --parallel=3

  agents:
    name: Nx Cloud - Agents
    uses: nrwl/ci/.github/workflows/nx-cloud-agents.yml@v0.15.0
    with:
      node-version: 24
      yarn-version: 1.22.19
      number-of-agents: 3
      # test-storybook runs the stories in Chromium (see packages/core/vitest.config.mjs)
      install-commands: |
        yarn install --frozen-lockfile
        npx playwright install --with-deps chromium
